  const get  = (url) => fetch(API+url,{headers}).then(r=>r.json());
  const post = (url,body) => fetch(API+url,{method:'POST',headers,body:JSON.stringify(body)}).then(r=>r.json());
  const put  = (url,body) => fetch(API+url,{method:'PUT',headers,body:JSON.stringify(body)}).then(r=>r.json());
  const del  = (url) => fetch(API+url,{method:'DELETE',headers}).then(r=>r.json());
  return { get, post, put, del };
}

// ── CRM ──────────────────────────────────────────────────────
function CRM() {
  const api = useApi();
  const [clientes, setClientes] = useState([]);
  const [selected, setSelected] = useState(null);
  const [detalhe, setDetalhe] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [busca, setBusca] = useState('');
  const [filtroStatus, setFiltroStatus] = useState('todos');
  const [novaInteracao, setNovaInteracao] = useState('');
  const [loadingDetalhe, setLoadingDetalhe] = useState(false);
  const [form, setForm] = useState({ empresa:'', cnpj:'', contato:'', cargo:'', telefone:'', whatsapp:'', email:'', origem:'Indicacao', status:'Lead', observacoes:'' });
  const [buscandoCNPJ, setBuscandoCNPJ] = useState(false);

  const STATUS_COLS = ['Lead','Em negociacao','Fechado','Perdido'];
  const STATUS_CORES = { Lead:'#6366f1', 'Em negociacao':'#d97706', Fechado:'#16a34a', Perdido:'#dc2626' };

  const load = () => api.get('/clientes').then(function(r){ if(Array.isArray(r)) setClientes(r); }).catch(function(){});
  useEffect(function(){ load(); },[]);

  async function buscarCNPJ(cnpj) {
    const nums = cnpj.split('').filter(function(c){ return c >= '0' && c <= '9'; }).join('');
    if (nums.length !== 14) return alert('CNPJ invalido - digite 14 numeros');
    setBuscandoCNPJ(true);
    try {
      const res = await fetch('https://publica.cnpj.ws/cnpj/' + nums);
      if (!res.ok) { alert('CNPJ nao encontrado.'); setBuscandoCNPJ(false); return; }
      const d = await res.json();
      const razao = d.razao_social || '';
      const fantasia = d.estabelecimento && d.estabelecimento.nome_fantasia ? d.estabelecimento.nome_fantasia : '';
      const nome = fantasia || razao;
      const tel = d.estabelecimento && d.estabelecimento.telefone1 ? d.estabelecimento.telefone1 : '';
      const email = d.estabelecimento && d.estabelecimento.email ? d.estabelecimento.email.toLowerCase() : '';
      const end = d.estabelecimento;
      const cidade = end ? (end.cidade ? end.cidade.nome : '') : '';
      const estado = end ? (end.estado ? end.estado.sigla : '') : '';
      const obs = razao !== nome ? 'Razao Social: ' + razao + (cidade ? ' | ' + cidade + '/' + estado : '') : (cidade ? cidade + '/' + estado : '');
      setForm(function(p) {
        return {
          ...p,
          empresa:    nome || p.empresa,
          telefone:   tel  || p.telefone,
          whatsapp:   tel  || p.whatsapp,
          email:      email|| p.email,
          observacoes:obs  || p.observacoes,
        };
      });
      alert('Dados preenchidos! Empresa: ' + nome);
    } catch(e) {
      alert('Erro na busca: ' + e.message);
    }
    setBuscandoCNPJ(false);
  }

  async function salvar() {
    if (!form.empresa) return alert('Nome da empresa obrigatorio');
    try {
      await api.post('/clientes', { ...form });
      setShowForm(false);
      setForm({ empresa:'', cnpj:'', contato:'', cargo:'', telefone:'', whatsapp:'', email:'', origem:'Indicacao', status:'Lead', observacoes:'' });
      load();
    } catch(e) { alert('Erro: ' + e.message); }
  }

  async function abrirCliente(c) {
    setSelected(c);
    setLoadingDetalhe(true);
    setDetalhe(null);
    try {
      // Buscar dados completos: cliente + propostas + PIs + historico financeiro
      const [det, props, pis] = await Promise.all([
        api.get('/clientes/' + c.id),
        api.get('/propostas?cliente_id=' + c.id),
        api.get('/pi')
      ]);
      const piCliente = Array.isArray(pis) ? pis.filter(function(p){ return p.cliente_id === c.id; }) : [];
      const propsCliente = Array.isArray(props) ? props : [];
      
      // Calcular total comprado
      const totalComprado = piCliente.reduce(function(a,b){ return a + parseFloat(b.valor_total||0); }, 0);
      
      // Coletar midias unicas
      const midiasSet = {};
      piCliente.forEach(function(pi){
        (pi.midias||[]).forEach(function(m){
          const nome = m.midia_nome || m.nome || m;
          midiasSet[nome] = (midiasSet[nome]||0) + 1;
        });
      });

      setDetalhe({
        ...det,
        propostas: propsCliente,
        pis: piCliente,
        totalComprado: totalComprado,
        midias: midiasSet,
        qtdCampanhas: piCliente.length,
        qtdPropostas: propsCliente.length,
        interacoes: det.interacoes || []
      });
    } catch(e) { console.error(e); }
    setLoadingDetalhe(false);
  }

  async function addInteracao() {
    if (!novaInteracao.trim() || !selected) return;
    try {
      await api.post('/clientes/' + selected.id + '/interacoes', { descricao: novaInteracao });
      setNovaInteracao('');
      abrirCliente(selected);
    } catch(e) { alert('Erro: ' + e.message); }
  }

  const clientesFiltrados = clientes.filter(function(c) {
    const matchBusca = !busca || c.empresa.toLowerCase().includes(busca.toLowerCase()) || (c.contato||'').toLowerCase().includes(busca.toLowerCase());
    const matchStatus = filtroStatus === 'todos' || c.status === filtroStatus;
    return matchBusca && matchStatus;
  });

  // Estatisticas gerais
  const stats = {
    total: clientes.length,
    lead: clientes.filter(function(c){ return c.status==='Lead'; }).length,
    negociacao: clientes.filter(function(c){ return c.status==='Em negociacao'; }).length,
    fechado: clientes.filter(function(c){ return c.status==='Fechado'; }).length,
  };

  return (
    <div style={{display:'flex',gap:20,height:'calc(100vh - 108px)'}}>

      {/* COLUNA ESQUERDA - Lista */}
      <div style={{width:360,flexShrink:0,display:'flex',flexDirection:'column',gap:12}}>

        {/* Header + botao */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <h2 style={{fontSize:18,fontWeight:700,color:C.text}}>Clientes</h2>
          <Btn onClick={function(){ setShowForm(!showForm); }} style={{fontSize:12,padding:'7px 14px'}}>+ Novo</Btn>
        </div>

        {/* Formulario novo cliente */}
        {showForm && (
          <div style={{...s.card,padding:16}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:12,color:C.accent}}>Novo Cliente</div>
            <div style={{marginBottom:12}}>
              <label style={s.label}>CNPJ</label>
              <div style={{display:'flex',gap:8}}>
                <input
                  style={{...s.input,flex:1}}
                  value={form.cnpj||''}
                  onChange={function(e){
                    var digits = '';
                    var src = e.target.value;
                    for(var i=0;i<src.length&&digits.length<14;i++){ if(src[i]>='0'&&src[i]<='9') digits+=src[i]; }
                    var m = digits;
                    if(digits.length>2)  m = digits.substring(0,2)+'.'+digits.substring(2);
                    if(digits.length>5)  m = digits.substring(0,2)+'.'+digits.substring(2,5)+'.'+digits.substring(5);
                    if(digits.length>8)  m = digits.substring(0,2)+'.'+digits.substring(2,5)+'.'+digits.substring(5,8)+'/'+digits.substring(8);
                    if(digits.length>12) m = digits.substring(0,2)+'.'+digits.substring(2,5)+'.'+digits.substring(5,8)+'/'+digits.substring(8,12)+'-'+digits.substring(12);
                    setForm(function(p){ return {...p,cnpj:m}; });
                  }}
                  placeholder="00.000.000/0001-00"
                  maxLength={18}
                />
                <button
                  onClick={function(){ buscarCNPJ(form.cnpj||''); }}
                  disabled={buscandoCNPJ}
                  style={{background:buscandoCNPJ?'#94a3b8':'#0a1172',color:'white',border:'none',borderRadius:9,padding:'9px 14px',cursor:buscandoCNPJ?'not-allowed':'pointer',fontSize:12,fontWeight:700,whiteSpace:'nowrap',flexShrink:0}}>
                  {buscandoCNPJ ? 'Buscando...' : 'Buscar'}
                </button>
              </div>
              <div style={{fontSize:11,color:'#64748b',marginTop:4}}>Digite o CNPJ e clique em Buscar para preencher automaticamente</div>
            </div>
            <Input label="Empresa *" value={form.empresa} onChange={function(v){ setForm(function(p){ return {...p,empresa:v}; }); }}/>
            <Input label="Contato" value={form.contato} onChange={function(v){ setForm(function(p){ return {...p,contato:v}; }); }}/>
            <Input label="Cargo" value={form.cargo} onChange={function(v){ setForm(function(p){ return {...p,cargo:v}; }); }}/>
            <Input label="Telefone" value={form.telefone} onChange={function(v){ setForm(function(p){ return {...p,telefone:v}; }); }}/>
            <Input label="WhatsApp" value={form.whatsapp} onChange={function(v){ setForm(function(p){ return {...p,whatsapp:v}; }); }}/>
            <Input label="Email" value={form.email} onChange={function(v){ setForm(function(p){ return {...p,email:v}; }); }} type="email"/>
            <Select label="Origem" value={form.origem} onChange={function(v){ setForm(function(p){ return {...p,origem:v}; }); }} options={['Indicacao','Google Ads','Redes Sociais','Evento','Site','Prospeccao Ativa']}/>
            <Select label="Status" value={form.status} onChange={function(v){ setForm(function(p){ return {...p,status:v}; }); }} options={STATUS_COLS}/>
            <div style={{display:'flex',gap:8,marginTop:8}}>
              <Btn onClick={salvar} style={{fontSize:12}}>Salvar</Btn>
              <Btn variant="ghost" onClick={function(){ setShowForm(false); }} style={{fontSize:12}}>Cancelar</Btn>
            </div>
          </div>
        )}

        {/* Stats rapidas */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          {[['Total',stats.total,C.accent],['Leads',stats.lead,'#6366f1'],['Negociando',stats.negociacao,C.warning],['Fechados',stats.fechado,C.success]].map(function(item,i){
            return (
              <div key={i} style={{background:C.card,border:'1px solid '+C.border,borderRadius:10,padding:'10px 14px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:11,color:C.muted,fontWeight:600}}>{item[0]}</span>
                <span style={{fontSize:20,fontWeight:800,color:item[2]}}>{item[1]}</span>
              </div>
            );
          })}
        </div>

        {/* Busca e filtro */}
        <div style={{display:'flex',gap:8}}>
          <input
            style={{...s.input,flex:1,fontSize:12}}
            placeholder="Buscar cliente..."
            value={busca}
            onChange={function(e){ setBusca(e.target.value); }}
          />
          <select style={{...s.select,width:'auto',fontSize:12}} value={filtroStatus} onChange={function(e){ setFiltroStatus(e.target.value); }}>
            <option value="todos">Todos</option>
            {STATUS_COLS.map(function(s){ return <option key={s} value={s}>{s}</option>; })}
          </select>
        </div>

        {/* Lista de clientes */}
        <div style={{flex:1,overflow:'auto',display:'flex',flexDirection:'column',gap:6}}>
          {clientesFiltrados.length === 0 && (
            <div style={{textAlign:'center',padding:32,color:C.muted,fontSize:13}}>
              {busca ? 'Nenhum resultado: '+busca+'"' : 'Nenhum cliente cadastrado.'}
            </div>
          )}
          {clientesFiltrados.map(function(c) {
            const isSelected = selected && selected.id === c.id;
            const statusCor = STATUS_CORES[c.status] || C.muted;
            return (
              <div
                key={c.id}
                onClick={function(){ abrirCliente(c); }}
                style={{
                  background: isSelected ? C.accentSoft : C.card,
                  border: '1px solid ' + (isSelected ? C.accent : C.border),
                  borderLeft: '4px solid ' + statusCor,
                  borderRadius: 10,
                  padding: '12px 14px',
                  cursor: 'pointer',
                  transition: 'all 0.15s',
                }}
              >
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}}>
                  <div style={{fontSize:13,fontWeight:700,color:C.text}}>{c.empresa}</div>
                  <span style={{...s.badge(statusCor),fontSize:10}}>{c.status}</span>
                </div>
                <div style={{fontSize:12,color:C.muted}}>{c.contato}{c.cargo ? ' - ' + c.cargo : ''}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:2}}>{c.email||''}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:2}}>Origem: {c.origem||'—'}</div>

      {/* COLUNA DIREITA - Perfil do cliente */}
      <div style={{flex:1,overflow:'auto'}}>

            <div style={{fontSize:48,opacity:0.2}}>O</div>
            <div style={{fontSize:15,color:C.muted,fontWeight:600}}>Selecione um cliente para ver os detalhes</div>
            <div style={{fontSize:13,color:C.muted}}>{clientes.length} clientes cadastrados</div>
          </div>
        )}

        {selected && (
          <div style={{display:'flex',flexDirection:'column',gap:16}}>

            {/* Header do cliente */}
            <div style={{...s.card}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div style={{display:'flex',gap:14,alignItems:'center'}}>
                  <div style={{width:52,height:52,borderRadius:14,background:C.accentSoft,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,fontWeight:800,color:C.accent,flexShrink:0}}>
                    {(selected.empresa||'?')[0].toUpperCase()}
                  </div>
                  <div>
                    <h2 style={{fontSize:18,fontWeight:800,color:C.text}}>{selected.empresa}</h2>
                    <div style={{fontSize:13,color:C.muted,marginTop:2}}>{selected.contato}{selected.cargo ? ' - ' + selected.cargo : ''}</div>
                    <div style={{display:'flex',gap:8,marginTop:6}}>
                      <span style={s.badge(STATUS_CORES[selected.status]||C.muted)}>{selected.status}</span>
                      <span style={{...s.badge(C.teal),fontSize:10}}>Origem: {selected.origem}</span>
                    </div>
                  </div>
                </div>
                <button onClick={function(){ setSelected(null); setDetalhe(null); }} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:C.muted,padding:4}}>X</button>
              </div>

              {/* Contatos */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginTop:16,paddingTop:16,borderTop:'1px solid '+C.border}}>
                {[['Email',selected.email],['Telefone',selected.telefone],['WhatsApp',selected.whatsapp]].map(function(item,i){
                  return (
                    <div key={i}>
                      <div style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:2}}>{item[0]}</div>
                      <div style={{fontSize:13,fontWeight:500,color:C.text}}>{item[1]||'—'}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* KPIs do cliente */}
            {loadingDetalhe && <div style={{...s.card,textAlign:'center',padding:24,color:C.muted}}>Carregando dados...</div>}

            {detalhe && (
              <>
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
                  {[
                    ['Total Comprado', 'R$ ' + Number(detalhe.totalComprado||0).toLocaleString('pt-BR',{minimumFractionDigits:2}), C.accent],
                    ['Campanhas', detalhe.qtdCampanhas || 0, C.success],
                    ['Propostas', detalhe.qtdPropostas || 0, '#6366f1'],
                  ].map(function(item,i){
                    return (
                      <div key={i} style={{...s.kpi,textAlign:'center'}}>
                        <div style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6}}>{item[0]}</div>
                        <div style={{fontSize:24,fontWeight:800,color:item[2]}}>{item[1]}</div>
                      </div>
                    );
                  })}
                </div>

                {/* Midias utilizadas */}
                {Object.keys(detalhe.midias||{}).length > 0 && (
                  <div style={s.card}>
                    <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:12}}>Midias Utilizadas</div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                      {Object.entries(detalhe.midias).map(function(entry,i){
                        return (
                          <div key={i} style={{background:C.accentSoft,border:'1px solid '+C.accent+'30',borderRadius:8,padding:'6px 14px',display:'flex',alignItems:'center',gap:6}}>
                            <span style={{fontSize:13,fontWeight:600,color:C.accent}}>{entry[0]}</span>
                            {entry[1] > 1 && <span style={{fontSize:11,background:C.accent,color:'white',borderRadius:'50%',width:18,height:18,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}}>{entry[1]}</span>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Campanhas (PIs) */}
                {detalhe.pis && detalhe.pis.length > 0 && (
                  <div style={s.card}>
                    <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:12}}>Campanhas Contratadas</div>
                    <table style={s.table}>
                      <thead>
                        <tr>
                          {['PI','Campanha','Periodo','Valor','Status'].map(function(h){
                            return <th key={h} style={s.th}>{h}</th>;
                          })}
                        </tr>
                      </thead>
                      <tbody>
                        {detalhe.pis.map(function(pi){
                          return (
                            <tr key={pi.id}>
                              <td style={{...s.td,fontFamily:'monospace',fontSize:11,color:C.accent}}>{pi.numero}</td>
                              <td style={{...s.td,fontWeight:600}}>{pi.campanha}</td>
                              <td style={{...s.td,fontSize:12,color:C.muted}}>
                                {pi.periodo_inicio ? new Date(pi.periodo_inicio).toLocaleDateString('pt-BR') : '—'}
                                {' a '}
                                {pi.periodo_fim ? new Date(pi.periodo_fim).toLocaleDateString('pt-BR') : '—'}
                              </td>
                              <td style={{...s.td,fontWeight:700,color:C.accent}}>R$ {Number(pi.valor_total||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</td>
                              <td style={s.td}><Badge status={pi.status}/></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* Propostas */}
                {detalhe.propostas && detalhe.propostas.length > 0 && (
                  <div style={s.card}>
                    <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:12}}>Historico de Propostas</div>
                    <table style={s.table}>
                      <thead>
                        <tr>
                          {['Numero','Titulo','Valor','Status'].map(function(h){
                            return <th key={h} style={s.th}>{h}</th>;
                          })}
                        </tr>
                      </thead>
                      <tbody>
                        {detalhe.propostas.map(function(p){
                          return (
                            <tr key={p.id}>
                              <td style={{...s.td,fontFamily:'monospace',fontSize:11,color:C.muted}}>{p.numero}</td>
                              <td style={{...s.td,fontWeight:600}}>{p.titulo}</td>
                              <td style={{...s.td,color:C.accent,fontWeight:700}}>R$ {Number(p.valor||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</td>
                              <td style={s.td}><Badge status={p.status}/></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* Historico de interacoes */}
                <div style={s.card}>
                  <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:12}}>Historico de Interacoes</div>
                  <div style={{display:'flex',gap:8,marginBottom:14}}>
                    <input
                      style={{...s.input,flex:1,fontSize:13}}
                      placeholder="Registrar nova interacao..."
                      value={novaInteracao}
                      onChange={function(e){ setNovaInteracao(e.target.value); }}
                      onKeyDown={function(e){ if(e.key==='Enter') addInteracao(); }}
                    />
                    <Btn onClick={addInteracao} style={{fontSize:12,padding:'9px 16px'}}>+ Registrar</Btn>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:200,overflow:'auto'}}>
                    {(detalhe.interacoes||[]).length === 0 && (
                      <div style={{fontSize:13,color:C.muted,textAlign:'center',padding:16}}>Nenhuma interacao registrada.</div>
                    )}
                    {(detalhe.interacoes||[]).map(function(inter,i){
                      return (
                        <div key={i} style={{display:'flex',gap:10,padding:'8px 10px',background:'#f8fafc',borderRadius:8,borderLeft:'3px solid '+C.accent}}>
                          <div style={{flex:1}}>
                            <div style={{fontSize:13,color:C.text}}>{inter.descricao||inter}</div>
                            {inter.criado_em && <div style={{fontSize:11,color:C.muted,marginTop:2}}>{new Date(inter.criado_em).toLocaleString('pt-BR')}</div>}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function Propostas() {
  const api = useApi();
  const [propostas, setPropostas] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [precos, setPrecos] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [showPrecos, setShowPrecos] = useState(false);
  const [editandoPreco, setEditandoPreco] = useState(null);
  const [precosEdit, setPrecosEdit] = useState({});

  // Form da proposta
  const [form, setForm] = useState({
    cliente_id:'', titulo:'', cnpj:'', agencia:'',
    periodo_inicio:'', periodo_fim:'', observacoes:'',
    midias_selecionadas: [] // [{midia_id, midia_nome, tipo, dias_horas_periodos, preco_unit, preco_total, unidade, editado}]
  });

  // Mídia sendo adicionada
  const [midiaAdd, setMidiaAdd] = useState({
    precoId: '', quantidade: 1, precoCustom: ''
  });

  const load = () => {
    api.get('/propostas').then(setPropostas).catch(()=>[]);
    api.get('/clientes').then(setClientes).catch(()=>[]);
    api.get('/precos').then(function(data){ setPrecos(Array.isArray(data) ? data : []); }).catch(function(){ setPrecos([]); });
  };
  useEffect(()=>{ load(); },[]);

  // Calcular preço de uma mídia com base na quantidade
  function calcularPreco(preco, quantidade) {
    if (!preco || !quantidade) return 0;
    const qty = parseInt(quantidade) || 1;

    if (preco.tipo === 'diaria') {
      let precoDia = parseFloat(preco.preco_1);
      if (qty >= 7 && preco.preco_7mais)       precoDia = parseFloat(preco.preco_7mais);
      else if (qty >= 2 && preco.preco_2_6)    precoDia = parseFloat(preco.preco_2_6);
      return precoDia * qty;
    }

    if (preco.tipo === 'pacote30') {
      const base = parseFloat(preco.preco_1);
      if (qty >= 2) {
        const desc = parseFloat(preco.desconto_multi || 10) / 100;
        return base * qty * (1 - desc);
      }
      return base * qty;
    }

    if (preco.tipo === 'hora') {
      const baseHora = parseFloat(preco.preco_1);
      if (qty >= 6) {
        const desc = parseFloat(preco.desconto_6h || 30) / 100;
        return baseHora * qty * (1 - desc);
      }
      return baseHora * qty;
    }

    return 0;
  }

  function labelQuantidade(tipo) {
    if (tipo === 'diaria')   return 'Dias';
    if (tipo === 'pacote30') return 'Períodos (30 dias cada)';
    if (tipo === 'hora')     return 'Horas';
    return 'Quantidade';
  }

  function precoUnitLabel(preco, quantidade) {
    if (!preco) return '';
    const qty = parseInt(quantidade) || 1;
    if (preco.tipo === 'diaria') {
      let p = parseFloat(preco.preco_1);
      let faixa = '1 dia';
      if (qty >= 7 && preco.preco_7mais)    { p = parseFloat(preco.preco_7mais); faixa = '7+ dias'; }
      else if (qty >= 2 && preco.preco_2_6) { p = parseFloat(preco.preco_2_6);  faixa = '2-6 dias'; }
      return `R$ ${p.toLocaleString('pt-BR',{minimumFractionDigits:2})} / dia (faixa: ${faixa})`;
    }
    if (preco.tipo === 'pacote30') {
      const p = parseFloat(preco.preco_1);
      const desc = preco.desconto_multi || 10;
      return qty >= 2
        ? `R$ ${p.toLocaleString('pt-BR',{minimumFractionDigits:2})} × ${qty} períodos − ${desc}% = desconto aplicado`
        : `R$ ${p.toLocaleString('pt-BR',{minimumFractionDigits:2})} / período 30 dias`;
    }
    if (preco.tipo === 'hora') {
      const p = parseFloat(preco.preco_1);
      const desc = preco.desconto_6h || 30;
      return qty >= 6
        ? `R$ ${p.toLocaleString('pt-BR',{minimumFractionDigits:2})} / hora × ${qty}h − ${desc}% pacote`
        : `R$ ${p.toLocaleString('pt-BR',{minimumFractionDigits:2})} / hora`;
    }
    return '';
  }

  function adicionarMidia() {
    const preco = precos.find(p => p.id === midiaAdd.precoId);
    if (!preco) return alert('Selecione uma mídia');
    const qty = parseInt(midiaAdd.quantidade) || 1;
    if (qty <= 0) return alert('Quantidade deve ser maior que zero');

    const totalAuto = calcularPreco(preco, qty);
    const totalFinal = midiaAdd.precoCustom ? parseFloat(midiaAdd.precoCustom.replace(',','.')) : totalAuto;

    const item = {
      midia_id:    preco.id,
      midia_nome:  preco.midia_nome,
      tipo:        preco.tipo,
      quantidade:  qty,
      unidade:     preco.unidade,
      preco_unit:  parseFloat(preco.preco_1),
      preco_total: totalFinal,
      preco_auto:  totalAuto,
      editado:     !!midiaAdd.precoCustom,
      label_unit:  precoUnitLabel(preco, qty),
    };

    setForm(p => ({
      ...p,
      midias_selecionadas: [...p.midias_selecionadas, item]
    }));
    setMidiaAdd({ precoId:'', quantidade:1, precoCustom:'' });
  }

  function removerMidia(idx) {
    setForm(p => ({
      ...p,
      midias_selecionadas: p.midias_selecionadas.filter((_,i) => i !== idx)
    }));
  }

  function editarPrecoMidia(idx, novoValor) {
    setForm(p => {
      const arr = [...p.midias_selecionadas];
      arr[idx] = { ...arr[idx], preco_total: parseFloat(novoValor.replace(',','.')) || 0, editado: true };
      return { ...p, midias_selecionadas: arr };
    });
  }

  const totalProposta = form.midias_selecionadas.reduce((a,m) => a + (m.preco_total || 0), 0);

  async function salvar() {
    if (!form.cliente_id || !form.titulo) return alert('Cliente e título obrigatórios');
    if (form.midias_selecionadas.length === 0) return alert('Adicione pelo menos uma mídia');
    try {
      const payload = {
        cliente_id:    form.cliente_id,
        titulo:        form.titulo,
        cnpj:          form.cnpj || '',
        agencia:       form.agencia || '',
        periodo_inicio: form.periodo_inicio || null,
        periodo_fim:   form.periodo_fim || null,
        valor:         totalProposta,
        observacoes:   form.observacoes || '',
        midias:        form.midias_selecionadas.map(m => ({
          nome:        m.midia_nome,
          quantidade:  m.quantidade,
          tipo:        m.tipo,
          preco_total: m.preco_total,
          unidade:     m.unidade,
          label_unit:  m.label_unit,
          editado:     m.editado,
        }))
      };
      const res = await api.post('/propostas', payload);
      if (res.erro) { alert('Erro: ' + res.erro); return; }
      setShowForm(false);
      setForm({ cliente_id:'', titulo:'', cnpj:'', agencia:'', periodo_inicio:'', periodo_fim:'', observacoes:'', midias_selecionadas:[] });
      load();
    } catch(e) { alert('Erro: ' + e.message); }
  }

  // Editar tabela de preços
  async function salvarPreco(id) {
    const ed = precosEdit[id];
    if (!ed) return;
    try {
      await api.put('/precos/' + id, ed);
      setEditandoPreco(null);
      load();
      alert('Preço atualizado!');
    } catch(e) { alert('Erro: ' + e.message); }
  }

  async function mudarStatus(id, status) {
    try {
      await api.put('/propostas/'+id+'/status', { status });
      load();
    } catch(e) { alert('Erro: ' + e.message); }
  }

  async function aprovar(id) {
    if (!window.confirm('Aprovar esta proposta? Isso gerará um PI, Produção e Cobrança automaticamente.')) return;
    try {
      const res = await api.put('/propostas/'+id+'/status', { status:'Aprovada' });
      if (res.erro) { alert('Erro: ' + res.erro); return; }
      load();
      const proposta = propostas.find(p=>p.id===id) || {};
      const clienteData = clientes.find(c=>c.id===proposta.cliente_id) || {};
      setTimeout(()=>{
        if (window.confirm('Proposta aprovada! Deseja gerar o PDF financeiro agora?')) {
          gerarPDFFinanceiro({...proposta}, res.pi, clienteData);
        }
      }, 500);
    } catch(e) { alert('Erro: ' + e.message); }
  }

  function gerarPDFProposta(proposta) {
    const cliente = clientes.find(c=>c.id===proposta.cliente_id) || {};
    const midias = proposta.midias || [];
    const dataHora = new Date().toLocaleString('pt-BR');
    const periodoInicio = proposta.periodo_inicio ? new Date(proposta.periodo_inicio).toLocaleDateString('pt-BR') : '—';
    const periodoFim    = proposta.periodo_fim    ? new Date(proposta.periodo_fim).toLocaleDateString('pt-BR')    : '—';

    const linhasMidias = midias.map(function(m) {
      return '<tr>'
        + '<td style="padding:10px 12px;border-bottom:1px solid #eee;font-weight:600">' + (m.nome||m) + '</td>'
        + '<td style="padding:10px 12px;border-bottom:1px solid #eee;color:#888">' + (m.unidade||'') + '</td>'
        + '<td style="padding:10px 12px;border-bottom:1px solid #eee;text-align:center">' + (m.quantidade||1) + '</td>'
        + '<td style="padding:10px 12px;border-bottom:1px solid #eee;color:#888;font-size:11px">' + (m.label_unit||'') + '</td>'
        + '<td style="padding:10px 12px;border-bottom:1px solid #eee;text-align:right;font-weight:700;color:#1a237e">'
        + 'R$ ' + Number(m.preco_total||0).toLocaleString('pt-BR',{minimumFractionDigits:2})
        + (m.editado ? ' <span style="font-size:10px;color:#f59e0b">(editado)</span>' : '')
        + '</td></tr>';
    }).join('');

    const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Proposta ' + proposta.numero + '</title>'
      + '<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;font-size:13px;padding:40px;color:#222}'
      + '.header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1a237e;padding-bottom:20px;margin-bottom:28px}'
      + '.logo{font-size:22px;font-weight:900;color:#1a237e}.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#e8eaf6;color:#1a237e}'
      + '.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px}'
      + '.field label{font-size:10px;color:#888;text-transform:uppercase;display:block;margin-bottom:2px}'
      + '.field span{font-size:13px;font-weight:600}'
      + 'table{width:100%;border-collapse:collapse}th{text-align:left;padding:10px 12px;background:#f8fafc;font-size:11px;text-transform:uppercase;color:#888;border-bottom:2px solid #e2e8f0}'
      + '.total-box{display:flex;justify-content:flex-end;margin-top:16px}'
      + '.total-inner{background:#1a237e;color:white;padding:14px 24px;border-radius:10px;text-align:center}'
      + '.total-inner label{font-size:11px;opacity:0.7;display:block;margin-bottom:4px}'
      + '.total-inner span{font-size:26px;font-weight:900}'
      + '.footer{margin-top:40px;border-top:1px solid #eee;padding-top:16px;font-size:11px;color:#888;display:flex;justify-content:space-between}'
      + '.assin{margin-top:50px;display:grid;grid-template-columns:1fr 1fr;gap:40px}'
      + '.assin-campo{border-top:1px solid #333;padding-top:8px;text-align:center;font-size:11px}'
      + '.obs{background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:12px;margin-top:16px;font-size:12px}'
      + '</style></head><body>'
      + '<div class="header"><div><div class="logo">Exfera Mídia OOH</div><div style="font-size:11px;color:#666;margin-top:4px">Proposta Comercial</div></div>'
      + '<div style="text-align:right"><div style="font-size:16px;font-weight:800;color:#1a237e">PROPOSTA COMERCIAL</div>'
      + '<div style="font-size:13px;font-weight:700;color:#666;margin-top:4px">' + proposta.numero + '</div>'
      + '<span class="badge">' + proposta.status + '</span></div></div>'
      + '<div class="grid">'
      + '<div class="field"><label>Cliente</label><span>' + (cliente.empresa || proposta.cliente_nome || '—') + '</span></div>'
      + '<div class="field"><label>CNPJ</label><span>' + (proposta.cnpj || '—') + '</span></div>'
      + '<div class="field"><label>Agência</label><span>' + (proposta.agencia || '—') + '</span></div>'
      + '<div class="field"><label>Campanha</label><span>' + proposta.titulo + '</span></div>'
      + '<div class="field"><label>Período Início</label><span>' + periodoInicio + '</span></div>'
      + '<div class="field"><label>Período Fim</label><span>' + periodoFim + '</span></div>'
      + '</div>'
      + '<table><thead><tr>'

                    {(p.midias||[]).slice(0,3).map((m,i)=>(
                      <span key={i} style={{...s.badge(C.accent),fontSize:10}}>{m.nome||m}</span>
                    ))}
                    {(p.midias||[]).length > 3 && <span style={{fontSize:10,color:C.muted}}>+{(p.midias||[]).length-3}</span>}
                  </div>
                </td>
                <td style={{...s.td,fontWeight:700,color:C.gold}}>{fmtN(p.valor)}</td>
                <td style={s.td}><Badge status={p.status}/></td>
                <td style={s.td}>
                  <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                    <Btn onClick={()=>gerarPDFProposta(p)} style={{fontSize:10,padding:'3px 8px',background:'#6366f1'}}>PDF</Btn>
                    {p.status==='Rascunho'&&<Btn onClick={()=>mudarStatus(p.id,'Enviada')} style={{fontSize:10,padding:'3px 8px',background:C.warning}}>Enviar</Btn>}
                    {(p.status==='Enviada'||p.status==='Rascunho')&&<Btn onClick={()=>aprovar(p.id)} style={{fontSize:10,padding:'3px 8px'}}>✓ Aprovar</Btn>}
                    {p.status==='Enviada'&&<Btn onClick={()=>mudarStatus(p.id,'Reprovada')} style={{fontSize:10,padding:'3px 8px',background:C.danger}}>Reprovar</Btn>}
                    {p.status==='Aprovada'&&<Btn onClick={()=>gerarPDFFinanceiro(p, null, clientes.find(c=>c.id===p.cliente_id))} style={{fontSize:10,padding:'3px 8px',background:'#e63946'}}>Doc Fin.</Btn>}
                  </div>
                </td>
              </tr>
            ))}
            {propostas.length===0&&<tr><td colSpan={8} style={{...s.td,textAlign:'center',color:C.muted,padding:32}}>Nenhuma proposta cadastrada.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Producao() {
  const api = useApi();
  const [ordens, setOrdens] = useState([]);
  const [pis, setPIs] = useState([]);
  const [erro, setErro] = useState('');
  const [loading, setLoading] = useState(true);
  const [filtroStatus, setFiltroStatus] = useState('todos');
  const [ordemAberta, setOrdemAberta] = useState(null);
  const [obsTexto, setObsTexto] = useState({});
  const [prazoEdit, setPrazoEdit] = useState({});

  const STATUS_INFO = {
    Pendente:      { cor: '#f59e0b', label: 'Pendente',      icon: '○' },
    'Em producao': { cor: '#1565c0', label: 'Em Producao',   icon: 'O' },
    Finalizado:    { cor: '#16a34a', label: 'Finalizado',     icon: '●' },
    Cancelado:     { cor: '#dc2626', label: 'Cancelado',      icon: 'X' },
  };

  const CHECKLIST_ITEMS = [
    { campo: 'check_arte',             label: 'Criacao de Arte',                   setor: 'Criacao'    },
    { campo: 'check_aprovacao',        label: 'Aprovacao do Cliente',              setor: 'Comercial'  },
    { campo: 'check_material_cliente', label: 'Material Recebido do Cliente',      setor: 'Producao'   },
    { campo: 'check_promotoras',       label: 'Promotoras Confirmadas',            setor: 'Operacional'},
    { campo: 'check_grafica',          label: 'Envio para Grafica / Midia Digital',setor: 'Producao'   },
  ];

  const load = async () => {
    setLoading(true); setErro('');
    try {
      const [ord, piList] = await Promise.all([api.get('/producao'), api.get('/pi')]);
      if (Array.isArray(ord)) setOrdens(ord);
      if (Array.isArray(piList)) setPIs(piList);
    } catch(e) { setErro('Erro ao carregar: ' + e.message); }
    setLoading(false);
  };
  useEffect(function(){ load(); }, []);

  function toggleItem(ordemId, ordemAtual, campo) {
    // Build new state
    var payload = {
      check_arte:             ordemAtual.check_arte             ? true : false,
      check_aprovacao:        ordemAtual.check_aprovacao        ? true : false,
      check_grafica:          ordemAtual.check_grafica          ? true : false,
      check_promotoras:       ordemAtual.check_promotoras       ? true : false,
      check_material_cliente: ordemAtual.check_material_cliente ? true : false,
    };
    payload[campo] = !payload[campo];

    var feitos = 0;
    CHECKLIST_ITEMS.forEach(function(it){ if(payload[it.campo]) feitos++; });
    var novoStatus = feitos === CHECKLIST_ITEMS.length ? 'Finalizado' : feitos > 0 ? 'Em producao' : 'Pendente';
    payload.status = novoStatus;

    // Optimistic update - update UI immediately without waiting for API
    setOrdens(function(prev) {
      return prev.map(function(o) {
        if (o.id !== ordemId) return o;
        return Object.assign({}, o, payload, { status: novoStatus });
      });
    });

    // Sync with backend in background
    api.put('/producao/' + ordemId + '/checklist', payload).then(function(res){
      if (res && res.erro) {
        // Revert on error
        setOrdens(function(prev) {
          return prev.map(function(o) {
            if (o.id !== ordemId) return o;
            return Object.assign({}, o, ordemAtual);
          });
        });
        alert('Erro ao salvar: ' + res.erro);
      }
    }).catch(function(e){
      alert('Erro de conexao: ' + e.message);
    });
  }

  async function salvarObs(ordemId) {
    const obs = obsTexto[ordemId] || '';
    try {
      await api.put('/producao/' + ordemId + '/status', { status: ordens.find(function(o){ return o.id===ordemId; }).status, observacoes: obs });
      alert('Observacao salva!');
    } catch(e) { alert('Erro: ' + e.message); }
  }

  async function criarOrdem(piId) {
    try {
      const res = await api.post('/producao', { pi_id: piId });
      if (res && res.erro) { alert('Erro: ' + res.erro); return; }
      load();
    } catch(e) { alert('Erro: ' + e.message); }
  }

  async function cancelarOrdem(ordemId) {
    if (!window.confirm('Cancelar esta ordem de producao?')) return;
    try {
      await api.put('/producao/' + ordemId + '/status', { status: 'Cancelado' });
      load();
    } catch(e) { alert('Erro: ' + e.message); }
  }

  function progresso(ordem) {
    const total = CHECKLIST_ITEMS.length;
    const feitos = CHECKLIST_ITEMS.filter(function(item){ return !!ordem[item.campo]; }).length;
    return { feitos: feitos, total: total, pct: Math.round((feitos/total)*100) };
  }

  const pisSemOrdem = pis.filter(function(pi) {
    return !ordens.find(function(o){ return o.pi_id === pi.id && o.status !== 'Cancelado'; });
  });

  const ordensFiltradas = ordens.filter(function(o) {
    if (filtroStatus === 'todos') return true;
    return o.status === filtroStatus;
  });

  const stats = {
    total:     ordens.length,
    pendente:  ordens.filter(function(o){ return o.status==='Pendente'; }).length,
    em_prod:   ordens.filter(function(o){ return o.status==='Em producao'; }).length,
    finalizado:ordens.filter(function(o){ return o.status==='Finalizado'; }).length,
  };

  function gerarOrdemPDF(ordem) {
    const pi = pis.find(function(p){ return p.id === ordem.pi_id; }) || {};
    const prog = progresso(ordem);
    const itens = CHECKLIST_ITEMS.map(function(item) {
      const ok = !!ordem[item.campo];
      return '<tr>'
        + '<td style="padding:8px 12px;border-bottom:1px solid #eee">' + item.label + '</td>'
        + '<td style="padding:8px 12px;border-bottom:1px solid #eee;color:#888">' + item.setor + '</td>'
        + '<td style="padding:8px 12px;border-bottom:1px solid #eee;text-align:center">'
        + (ok ? '<span style="color:#16a34a;font-weight:700">OK Concluido</span>' : '<span style="color:#f59e0b">Pendente</span>')
        + '</td></tr>';
    }).join('');

    const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Ordem de Producao</title>'

      + '.logo{font-size:20px;font-weight:900;color:#1a237e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}'
      + '.field label{font-size:10px;color:#888;text-transform:uppercase;display:block;margin-bottom:2px}.field span{font-size:13px;font-weight:600}'
      + 'table{width:100%;border-collapse:collapse}th{text-align:left;padding:10px 12px;background:#f8fafc;font-size:11px;text-transform:uppercase;color:#888;border-bottom:2px solid #e2e8f0}'
      + '.progress{height:8px;background:#e2e8f0;border-radius:4px;margin:4px 0}'
      + '.progress-bar{height:100%;background:#1a237e;border-radius:4px}'
      + '.footer{margin-top:40px;border-top:1px solid #eee;padding-top:16px;font-size:11px;color:#888;display:flex;justify-content:space-between}'
      + '.assin{margin-top:50px;display:grid;grid-template-columns:1fr 1fr;gap:40px}'
      + '.assin-campo{border-top:1px solid #333;padding-top:8px;text-align:center;font-size:11px}'
      + '</style></head><body>'
      + '<div class="header"><div><div class="logo">Exfera Midia OOH</div><div style="font-size:11px;color:#666;margin-top:4px">Ordem de Producao</div></div>'
      + '<div style="text-align:right"><div style="font-size:16px;font-weight:700;color:#1a237e">ORDEM DE PRODUCAO</div>'
      + '<div style="font-size:12px;color:#666;margin-top:4px">' + (pi.numero||'') + '</div></div></div>'
      + '<div class="grid">'
      + '<div class="field"><label>Campanha</label><span>' + (ordem.campanha||pi.campanha||'-') + '</span></div>'
      + '<div class="field"><label>Cliente</label><span>' + (ordem.cliente_nome||'-') + '</span></div>'
      + '<div class="field"><label>Periodo Inicio</label><span>' + (ordem.periodo_inicio ? new Date(ordem.periodo_inicio).toLocaleDateString('pt-BR') : '-') + '</span></div>'
      + '<div class="field"><label>Periodo Fim</label><span>' + (ordem.periodo_fim ? new Date(ordem.periodo_fim).toLocaleDateString('pt-BR') : '-') + '</span></div>'
      + '<div class="field"><label>Status</label><span>' + (ordem.status||'-') + '</span></div>'
      + '<div class="field"><label>Progresso</label><span>' + prog.feitos + '/' + prog.total + ' etapas (' + prog.pct + '%)</span><div class="progress"><div class="progress-bar" style="width:' + prog.pct + '%"></div></div></div>'
      + '</div>'
      + (ordem.observacoes ? '<div style="background:#f8fafc;border-radius:6px;padding:12px;margin-bottom:20px"><strong>Observacoes:</strong><br>' + ordem.observacoes + '</div>' : '')
      + '<table><thead><tr><th>Etapa</th><th>Setor</th><th>Status</th></tr></thead><tbody>' + itens + '</tbody></table>'
      + '<div class="assin"><div class="assin-campo">Responsavel pela Producao / Data</div><div class="assin-campo">Supervisor / Data</div></div>'
      + '<div class="footer"><span>Gerado em ' + new Date().toLocaleString('pt-BR') + ' via Exfera OOH Manager</span><span>' + (pi.numero||'') + '</span></div>'
      + '<script>window.onload=function(){window.print();}<\/script>'
      + '</body></html>';

    const win = window.open('', '_blank', 'width=900,height=700');
    win.document.write(html);
    win.document.close();
  }

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <h2 style={{fontSize:20,fontWeight:700,color:C.text}}>Producao</h2>
        <Btn onClick={load} variant="ghost" style={{fontSize:12}}>Atualizar</Btn>
      </div>

      {erro && <div style={{background:'rgba(220,38,38,0.08)',border:'1px solid rgba(220,38,38,0.3)',borderRadius:8,padding:12,marginBottom:16,fontSize:13,color:C.danger}}>{erro}</div>}

      <div style={{...s.grid4, marginBottom:20}}>
        {[
          ['Total',      stats.total,      C.accent,  'todos'],
          ['Pendentes',  stats.pendente,   '#f59e0b',  'Pendente'],
          ['Em Producao',stats.em_prod,    '#1565c0',  'Em producao'],
          ['Finalizados',stats.finalizado, '#16a34a',  'Finalizado'],
        ].map(function(item, i) {
          const isActive = filtroStatus === item[3];
          return (
            <div key={i} onClick={function(){ setFiltroStatus(item[3]); }}
              style={{...s.kpi, cursor:'pointer', borderLeft:'4px solid '+item[2], background: isActive ? item[2]+'12' : C.card, border: isActive ? '1px solid '+item[2]+'60' : '1px solid '+C.border}}>
              <div style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>{item[0]}</div>
              <div style={{fontSize:26,fontWeight:800,color:item[2]}}>{item[1]}</div>
            </div>
          );
        })}
      </div>

      {pisSemOrdem.length > 0 && (
        <div style={{...s.card, marginBottom:20, borderLeft:'4px solid #f59e0b', background:'#fffbeb'}}>
          <div style={{fontSize:13,fontWeight:700,color:'#92400e',marginBottom:12}}>
            [!] {pisSemOrdem.length} PI(s) aguardando ordem de producao

          {pisSemOrdem.map(function(pi) {
            return (
              <div key={pi.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid rgba(0,0,0,0.06)'}}>

                  <span style={{fontSize:13,marginLeft:10,fontWeight:600}}>{pi.campanha}</span>

                    {statusInfo.icon}

                  </div>

                <div style={{display:'flex',gap:8,alignItems:'center',flexShrink:0,marginLeft:12}}>

                  </button>
                  <button onClick={function(){ setOrdemAberta(isOpen ? null : ordem.id); }}

                              </div>
                              <div style={{flex:1}}>
                                <div style={{fontSize:13,fontWeight:checked?600:400,color:checked?'#166534':C.text,textDecoration:checked?'line-through':'none'}}>{item.label}</div>

function Checking() {
  const api = useApi();
  const [checkings, setCheckings] = useState([]);
  const [pis, setPIs] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [selected, setSelected] = useState(null);
  const [fotos, setFotos] = useState({});
  const [form, setForm] = useState({ pi_id:'', localizacao:'', observacao:'' });

  const load = async () => {
    try {
      const [ck, piList] = await Promise.all([api.get('/checking'), api.get('/pi')]);
      if (Array.isArray(ck)) setCheckings(ck);
      if (Array.isArray(piList)) setPIs(piList);
    } catch(e) {}
  };
  useEffect(function(){ load(); },[]);

  async function salvar() {
    if (!form.pi_id) return alert('Selecione a campanha');
    try {
      const res = await api.post('/checking', form);
      if (res.erro) { alert('Erro: ' + res.erro); return; }
      setShowForm(false);
      setForm({ pi_id:'', localizacao:'', observacao:'' });
      load();
    } catch(e) { alert('Erro: ' + e.message); }
  }

  function handleFotoUpload(checkId, e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    const readers = files.map(function(file) {
      return new Promise(function(resolve) {
        const reader = new FileReader();
        reader.onload = function(ev) {
          resolve({ name: file.name, data: ev.target.result, size: file.size });
        };
        reader.readAsDataURL(file);
      });
    });
    Promise.all(readers).then(function(novasFotos) {
      setFotos(function(prev) {
        const atual = prev[checkId] || [];
        return { ...prev, [checkId]: [...atual, ...novasFotos] };
      });
    });
  }

  function removerFoto(checkId, idx) {
    setFotos(function(prev) {
      const atual = [...(prev[checkId] || [])];
      atual.splice(idx, 1);
      return { ...prev, [checkId]: atual };
    });
