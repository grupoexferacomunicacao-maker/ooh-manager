    win.document.close();
  }

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <h2 style={{fontSize:20,fontWeight:700,color:C.text}}>Checking Fotografico</h2>
        <Btn onClick={function(){ setShowForm(!showForm); }}>+ Novo Checking</Btn>
      </div>

      {showForm && (
        <div style={{...s.card,marginBottom:20,borderLeft:'4px solid '+C.accent}}>
          <h3 style={{fontSize:14,fontWeight:700,marginBottom:16,color:C.accent}}>Novo Registro de Checking</h3>
          <div style={s.grid2}>
            <div style={{marginBottom:12}}>
              <label style={s.label}>Campanha / PI *</label>
              <select style={s.select} value={form.pi_id} onChange={function(e){ setForm(function(p){ return {...p,pi_id:e.target.value}; }); }}>
                <option value="">Selecione...</option>
                {pis.map(function(pi){ return <option key={pi.id} value={pi.id}>{pi.numero} - {pi.campanha} ({pi.cliente_nome})</option>; })}
              </select>
            </div>
            <Input label="Localizacao" value={form.localizacao} onChange={function(v){ setForm(function(p){ return {...p,localizacao:v}; }); }} placeholder="Ex: Av. Paulista, 1000 - SP"/>
            <div style={{gridColumn:'1/-1',marginBottom:12}}>
              <label style={s.label}>Observacao</label>
              <textarea style={{...s.input,height:72,resize:'vertical'}} value={form.observacao} onChange={function(e){ setForm(function(p){ return {...p,observacao:e.target.value}; });}}/>
            </div>
          </div>
          <div style={{display:'flex',gap:8,marginTop:4}}>
            <Btn onClick={salvar}>Salvar Checking</Btn>
            <Btn variant="ghost" onClick={function(){ setShowForm(false); }}>Cancelar</Btn>
          </div>
        </div>
      )}

      {checkings.length === 0 && !showForm && (
        <div style={{...s.card,textAlign:'center',padding:48,color:C.muted}}>
          <div style={{fontSize:40,marginBottom:12,opacity:0.3}}>[ ]</div>
          <div style={{fontSize:15,fontWeight:600}}>Nenhum checking registrado</div>
          <div style={{fontSize:13,marginTop:4}}>Clique em "+ Novo Checking" para comecar</div>
        </div>
      )}

      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        {checkings.map(function(c) {
          const pi = pis.find(function(p){ return p.id === c.pi_id; }) || {};
          const fotosC = fotos[c.id] || [];
          const isOpen = selected === c.id;

          return (
            <div key={c.id} style={{...s.card,borderLeft:'4px solid '+C.accent}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
                <div style={{display:'flex',gap:12,alignItems:'center'}}>
                  <div style={{width:44,height:44,borderRadius:10,background:C.accentSoft,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>[ ]</div>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:C.text}}>{c.campanha || pi.campanha}</div>
                    <div style={{fontSize:12,color:C.muted,marginTop:2}}>{c.cliente_nome}</div>
                    <div style={{display:'flex',gap:8,marginTop:4}}>
                      {pi.numero && <span style={{...s.badge(C.accent),fontSize:10}}>{pi.numero}</span>}
                      {c.data && <span style={{fontSize:11,color:C.muted}}>Data: {new Date(c.data).toLocaleDateString('pt-BR')}</span>}
                      {c.localizacao && <span style={{fontSize:11,color:C.muted}}>Local: {c.localizacao}</span>}
                    </div>
                  </div>
                </div>
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  {fotosC.length > 0 && <span style={{...s.badge(C.success),fontSize:11}}>{fotosC.length} foto(s)</span>}
                  <Btn
                    onClick={function(){ setSelected(isOpen ? null : c.id); }}
                    variant="ghost"
                    style={{fontSize:12,padding:'6px 12px',color:C.accent}}
                  >
                    {isOpen ? '▲ Fechar' : '▼ Abrir'}
                  </Btn>
                </div>
              </div>

              {isOpen && (
                <div style={{borderTop:'1px solid '+C.border,paddingTop:16}}>

                  {c.observacao && (
                    <div style={{background:'#f8fafc',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:13,color:C.muted,borderLeft:'3px solid '+C.accent}}>
                      {c.observacao}
                    </div>
                  )}

                  <div style={{marginBottom:16}}>
                    <label style={{...s.label,marginBottom:10}}>Fotos da Campanha</label>
                    <label style={{display:'flex',alignItems:'center',gap:10,padding:'12px 16px',background:C.accentSoft,border:'2px dashed '+C.accent+'60',borderRadius:10,cursor:'pointer',fontSize:13,color:C.accent,fontWeight:600,width:'fit-content'}}>
                      <span style={{fontSize:20}}>[cam]</span>
                      Adicionar Fotos
                      <input
                        type="file"
                        accept="image/*"
                        multiple
                        style={{display:'none'}}
                        onChange={function(e){ handleFotoUpload(c.id, e); }}
                      />
                    </label>
                    <div style={{fontSize:11,color:C.muted,marginTop:6}}>JPG, PNG, WEBP - multiplas fotos permitidas</div>
                  </div>

                  {fotosC.length > 0 && (
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:12,marginBottom:16}}>
                      {fotosC.map(function(foto, idx) {
                        return (
                          <div key={idx} style={{borderRadius:10,overflow:'hidden',border:'1px solid '+C.border,position:'relative'}}>
                            <img src={foto.data} alt={'Foto '+(idx+1)} style={{width:'100%',height:130,objectFit:'cover',display:'block'}}/>
                            <div style={{padding:'6px 8px',display:'flex',justifyContent:'space-between',alignItems:'center',background:'#f8fafc'}}>
                              <span style={{fontSize:10,color:C.muted,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:100}}>Foto {idx+1}</span>
                              <button
                                onClick={function(){ removerFoto(c.id, idx); }}
                                style={{background:'none',border:'none',cursor:'pointer',color:C.danger,fontSize:14,padding:'0 4px',fontWeight:700}}
                              >X</button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {fotosC.length === 0 && (
                    <div style={{textAlign:'center',padding:'20px',color:C.muted,fontSize:13,background:'#f8fafc',borderRadius:8,marginBottom:16}}>
                      Nenhuma foto adicionada ainda. Clique em "Adicionar Fotos" acima.
                    </div>
                  )}

                  <div style={{display:'flex',gap:10,paddingTop:12,borderTop:'1px solid '+C.border}}>
                    <Btn
                      onClick={function(){ gerarPDF(c); }}
                      style={{fontSize:13,padding:'10px 20px',display:'flex',alignItems:'center',gap:8}}
                    >
                       Gerar PDF de Comprovacao
                    </Btn>
                    {fotosC.length > 0 && (
                      <span style={{fontSize:12,color:C.success,display:'flex',alignItems:'center',gap:4}}>
                        OK {fotosC.length} foto(s) incluida(s) no relatorio
                      </span>
                    )}
                    {fotosC.length === 0 && (
                      <span style={{fontSize:12,color:C.warning,display:'flex',alignItems:'center',gap:4}}>
                         Adicione fotos para incluir no relatorio
                      </span>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── ALERTAS ──────────────────────────────────────────────────
function Alertas() {
  const api = useApi();
  const [alertas, setAlertas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filtro, setFiltro] = useState('todos');

  const TIPOS = {
    proposta_sem_resposta: { icon:'', label:'Proposta sem resposta', cor:'#d97706' },
    cobranca_atrasada:     { icon:'', label:'Cobranca atrasada',     cor:'#dc2626' },
    cobranca_proxima:      { icon:'⏰', label:'Vencimento proximo',    cor:'#f59e0b' },
    campanha_terminando:   { icon:'', label:'Campanha terminando',   cor:'#1565c0' },
    producao_parada:       { icon:'',  label:'Producao parada',       cor:'#7c3aed' },
  };
  const NIVEIS = {
    critico: { cor:'#dc2626', bg:'#fef2f2', label:'Critico'  },
    aviso:   { cor:'#d97706', bg:'#fffbeb', label:'Aviso'    },
    info:    { cor:'#1565c0', bg:'#eff6ff', label:'Info'     },
  };

  const load = async () => {
    setLoading(true);
    try {
      const data = await api.get('/alertas');
      if (Array.isArray(data)) setAlertas(data);
    } catch(e) {}
    setLoading(false);
  };
  useEffect(function(){ load(); }, []);

  function abrirWhatsApp(numero, mensagem) {
    const num = (numero||'').replace(/\D/g,'');
    if (!num) return alert('Numero de WhatsApp nao cadastrado para este cliente.');
    const url = 'https://wa.me/55' + num + '?text=' + encodeURIComponent(mensagem);
    window.open(url, '_blank');
  }

  function abrirEmail(email, assunto, corpo) {
    if (!email) return alert('Email nao cadastrado para este cliente.');
    window.open('mailto:' + email + '?subject=' + encodeURIComponent(assunto) + '&body=' + encodeURIComponent(corpo), '_blank');
  }

  function mensagemAlerta(alerta) {
    if (alerta.tipo === 'proposta_sem_resposta') {
      return 'Ola! Gostariamos de saber se voce teve a oportunidade de analisar nossa proposta ' + (alerta.referencia_num||'') + '. Estamos a disposicao para esclarecer qualquer duvida. Aguardamos seu retorno!';
    }
    if (alerta.tipo === 'cobranca_atrasada') {
      return 'Ola ' + alerta.cliente + '! Identificamos que existe um pagamento em aberto referente a ' + (alerta.descricao||'sua campanha') + '. Poderia nos informar a previsao de pagamento? Obrigado!';
    }
    if (alerta.tipo === 'cobranca_proxima') {
      return 'Ola ' + alerta.cliente + '! Lembramos que ha um pagamento com vencimento em breve referente a ' + (alerta.descricao||'sua campanha') + '. Qualquer duvida estamos a disposicao!';
    }
    return 'Ola ' + alerta.cliente + '! Temos um aviso importante sobre sua campanha. Entre em contato conosco!';
  }

  const filtrados = alertas.filter(function(a) {
    if (filtro === 'todos') return true;
    return a.nivel === filtro || a.tipo === filtro;
  });

  const criticos = alertas.filter(function(a){ return a.nivel === 'critico'; }).length;
  const avisos   = alertas.filter(function(a){ return a.nivel === 'aviso'; }).length;

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div>
          <h2 style={{fontSize:20,fontWeight:700,color:C.text}}>Central de Alertas</h2>
          <p style={{fontSize:13,color:C.muted,marginTop:2}}>Acompanhe pendencias e acoes necessarias</p>
        </div>
        <Btn onClick={load} variant="ghost" style={{fontSize:12}}>Atualizar</Btn>
      </div>

      <div style={{...s.grid4, marginBottom:20}}>
        {[
          ['Total',   alertas.length,  C.accent],
          ['Criticos', criticos,        '#dc2626'],
          ['Avisos',   avisos,          '#d97706'],
          ['Infos',    alertas.length - criticos - avisos, '#1565c0'],
        ].map(function(item,i){
          return (
            <div key={i} style={{...s.kpi, borderLeft:'4px solid '+item[2]}}>
              <div style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>{item[0]}</div>
              <div style={{fontSize:26,fontWeight:800,color:item[2]}}>{item[1]}</div>
            </div>
          );
        })}
      </div>

      <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
        {['todos','critico','aviso','info','proposta_sem_resposta','cobranca_atrasada','cobranca_proxima','campanha_terminando','producao_parada'].map(function(f){
          const label = f === 'todos' ? 'Todos' : (NIVEIS[f]||TIPOS[f]||{}).label || f;
          return (
            <button key={f} onClick={function(){ setFiltro(f); }}
              style={{...s.btn(filtro===f?'primary':'ghost'),fontSize:11,padding:'5px 12px'}}>
              {label}
            </button>
          );
        })}
      </div>

      {loading && <div style={{textAlign:'center',padding:40,color:C.muted}}>Verificando alertas...</div>}

      {!loading && filtrados.length === 0 && (
        <div style={{...s.card,textAlign:'center',padding:48}}>
          <div style={{fontSize:40,marginBottom:12}}>[OK]</div>
          <div style={{fontSize:15,fontWeight:700,color:'#16a34a'}}>Tudo em dia!</div>
          <div style={{fontSize:13,color:C.muted,marginTop:4}}>Nenhum alerta pendente no momento.</div>
          <div style={{marginTop:20,padding:'14px 20px',background:'#f8fafc',borderRadius:10,maxWidth:420,margin:'20px auto 0',textAlign:'left'}}>
            <div style={{fontSize:12,fontWeight:700,color:C.accent,marginBottom:8}}>Alertas sao gerados automaticamente quando:</div>
            <div style={{fontSize:12,color:C.muted,lineHeight:1.7}}>
              - Propostas ficam sem resposta por mais de 3 dias<br/>
              - Cobrancas vencem ou ficam atrasadas<br/>
              - Campanhas terminam em menos de 7 dias<br/>
              - Producao fica parada por mais de 5 dias
            </div>
          </div>
        </div>
      )}

      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {filtrados.map(function(alerta, i) {
          const tipo = TIPOS[alerta.tipo] || { icon:'!', label:alerta.tipo, cor:C.muted };
          const nivel = NIVEIS[alerta.nivel] || NIVEIS.info;
          const msg = mensagemAlerta(alerta);
          return (
            <div key={i} style={{background:nivel.bg, border:'1px solid '+nivel.cor+'40', borderLeft:'4px solid '+nivel.cor, borderRadius:12, padding:16}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12}}>
                <div style={{display:'flex',gap:12,alignItems:'flex-start',flex:1}}>
                  <div style={{fontSize:22,flexShrink:0,marginTop:2}}>{tipo.icon}</div>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                      <span style={{fontSize:13,fontWeight:700,color:nivel.cor}}>{alerta.titulo}</span>
                      <span style={{...s.badge(nivel.cor),fontSize:10}}>{nivel.label}</span>
                    </div>
                    <div style={{fontSize:12,color:C.text,marginBottom:4}}>{alerta.descricao}</div>
                    <div style={{display:'flex',gap:12,fontSize:11,color:C.muted}}>
                      {alerta.valor > 0 && <span style={{fontWeight:700,color:nivel.cor}}>R$ {Number(alerta.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>}
                      {alerta.vencimento && <span>Venc: {new Date(alerta.vencimento).toLocaleDateString('pt-BR')}</span>}
                      {alerta.referencia_num && <span style={{fontFamily:'monospace'}}>{alerta.referencia_num}</span>}
                    </div>
                  </div>
                </div>
                {alerta.contato && (
                  <div style={{display:'flex',gap:6,flexShrink:0}}>
                    {alerta.contato.whatsapp && (
                      <button onClick={function(){ abrirWhatsApp(alerta.contato.whatsapp, msg); }}
                        style={{background:'#25d366',border:'none',borderRadius:7,padding:'6px 10px',cursor:'pointer',color:'white',fontSize:11,fontWeight:700}}>
                        WhatsApp
                      </button>
                    )}
                    {alerta.contato.email && (
                      <button onClick={function(){ abrirEmail(alerta.contato.email, alerta.titulo, msg); }}
                        style={{background:'#1565c0',border:'none',borderRadius:7,padding:'6px 10px',cursor:'pointer',color:'white',fontSize:11,fontWeight:700}}>
                        Email
                      </button>
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── RELATORIO MENSAL ──────────────────────────────────────────
function RelatorioMensal() {
  const api = useApi();
  const now = new Date();
  const [ano, setAno] = useState(now.getFullYear());
  const [mes, setMes] = useState(now.getMonth() + 1);
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [abaAtiva, setAbaAtiva] = useState('resumo');

  const MESES = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  const load = async () => {
    setLoading(true);
    try {
      const res = await api.get('/relatorios/mensal?ano=' + ano + '&mes=' + mes);
      if (!res.erro) setData(res);
    } catch(e) {}
    setLoading(false);
  };
  useEffect(function(){ load(); }, [ano, mes]);

  const fmtR = function(v){ return 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2}); };

  function gerarPDFRelatorio() {
    if (!data) return;
    const topClientes = (data.top_clientes||[]).map(function(c,i){
      return '<tr><td style="padding:8px;border-bottom:1px solid #eee">'+(i+1)+'</td><td style="padding:8px;border-bottom:1px solid #eee">'+c.empresa+'</td><td style="padding:8px;border-bottom:1px solid #eee;font-weight:700">'+fmtR(c.total_pago)+'</td></tr>';
    }).join('');
    const topMidias = (data.top_midias||[]).map(function(m){
      return '<tr><td style="padding:8px;border-bottom:1px solid #eee">'+m.nome+'</td><td style="padding:8px;border-bottom:1px solid #eee;text-align:center">'+m.qtd+'</td><td style="padding:8px;border-bottom:1px solid #eee;font-weight:700">'+fmtR(m.receita)+'</td></tr>';
    }).join('');
    const conv = data.propostas && data.propostas.enviadas > 0 ? Math.round((data.propostas.aprovadas/data.propostas.enviadas)*100) : 0;
    const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Relatorio ' + MESES[mes-1] + ' ' + ano + '</title>'
      + '<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;font-size:13px;padding:40px}'
      + '.header{display:flex;justify-content:space-between;border-bottom:3px solid #1a237e;padding-bottom:20px;margin-bottom:28px}'
      + '.logo{font-size:20px;font-weight:900;color:#1a237e}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}'
      + '.kpi{background:#f8fafc;border-radius:8px;padding:16px;border-left:4px solid #1a237e}'
      + '.kpi label{font-size:10px;color:#888;text-transform:uppercase;display:block;margin-bottom:6px}'
      + '.kpi span{font-size:22px;font-weight:800;color:#1a237e}'
      + 'h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#888;border-bottom:1px solid #eee;padding-bottom:8px;margin-bottom:12px}'
      + 'table{width:100%;border-collapse:collapse}th{text-align:left;padding:8px;background:#f8fafc;font-size:11px;text-transform:uppercase;color:#888}'
      + '.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}'
      + '.footer{margin-top:40px;border-top:1px solid #eee;padding-top:12px;font-size:11px;color:#888;display:flex;justify-content:space-between}'
      + '</style></head><body>'
      + '<div class="header"><div><div class="logo">Exfera Midia OOH</div><div style="font-size:11px;color:#666;margin-top:4px">Relatorio Mensal de Performance</div></div>'
      + '<div style="text-align:right"><div style="font-size:16px;font-weight:800;color:#1a237e">' + MESES[mes-1].toUpperCase() + ' / ' + ano + '</div>'
      + '<div style="font-size:11px;color:#888;margin-top:4px">Gerado em ' + new Date().toLocaleString('pt-BR') + '</div></div></div>'
      + '<div class="grid">'
      + '<div class="kpi"><label>Faturamento</label><span>' + fmtR(data.faturamento.total) + '</span></div>'
      + '<div class="kpi"><label>Recebimentos</label><span>' + fmtR(data.recebimentos.total) + '</span></div>'
      + '<div class="kpi"><label>Novos PIs</label><span>' + (data.pis.qtd||0) + '</span></div>'
      + '<div class="kpi"><label>Novos Clientes</label><span>' + (data.novos_clientes.qtd||0) + '</span></div>'
      + '</div>'
      + '<div class="two-col">'
      + '<div><h3>Top 5 Clientes</h3><table><thead><tr><th>#</th><th>Cliente</th><th>Total Pago</th></tr></thead><tbody>' + topClientes + '</tbody></table></div>'
      + '<div><h3>Midias mais Vendidas</h3><table><thead><tr><th>Midia</th><th>Qtd</th><th>Receita</th></tr></thead><tbody>' + topMidias + '</tbody></table></div>'
      + '</div>'
      + '<div style="background:#f8fafc;border-radius:8px;padding:16px;margin-bottom:24px"><h3 style="margin-bottom:12px">Funil de Propostas</h3>'
      + '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">'
      + '<div style="text-align:center"><div style="font-size:24px;font-weight:800;color:#6366f1">' + (data.propostas.enviadas||0) + '</div><div style="font-size:11px;color:#888">Enviadas</div></div>'
      + '<div style="text-align:center"><div style="font-size:24px;font-weight:800;color:#16a34a">' + (data.propostas.aprovadas||0) + '</div><div style="font-size:11px;color:#888">Aprovadas</div></div>'
      + '<div style="text-align:center"><div style="font-size:24px;font-weight:800;color:#dc2626">' + (data.propostas.reprovadas||0) + '</div><div style="font-size:11px;color:#888">Reprovadas</div></div>'
      + '<div style="text-align:center"><div style="font-size:24px;font-weight:800;color:#1a237e">' + conv + '%</div><div style="font-size:11px;color:#888">Conversao</div></div>'
      + '</div></div>'
      + '<div class="footer"><span>Exfera Midia OOH - Relatorio Interno</span><span>Ref: ' + MESES[mes-1] + '/' + ano + '</span></div>'
      + '<script>window.onload=function(){window.print();}<\/script>'
      + '</body></html>';
    const win = window.open('', '_blank', 'width=1000,height=750');
    win.document.write(html);
    win.document.close();
  }

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div>
          <h2 style={{fontSize:20,fontWeight:700,color:C.text}}>Relatorio Mensal</h2>
          <p style={{fontSize:13,color:C.muted,marginTop:2}}>Performance e indicadores do periodo</p>
        </div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <select style={{...s.select,width:'auto'}} value={mes} onChange={function(e){ setMes(parseInt(e.target.value)); }}>
            {MESES.map(function(m,i){ return <option key={i} value={i+1}>{m}</option>; })}
          </select>
          <select style={{...s.select,width:'auto'}} value={ano} onChange={function(e){ setAno(parseInt(e.target.value)); }}>
            {[2024,2025,2026].map(function(a){ return <option key={a} value={a}>{a}</option>; })}
          </select>
          <Btn onClick={gerarPDFRelatorio} style={{fontSize:12}}> Exportar PDF</Btn>
        </div>
      </div>

      {loading && <div style={{textAlign:'center',padding:40,color:C.muted}}>Carregando relatorio...</div>}

      {data && (
        <>
          <div style={{...s.grid4,marginBottom:20}}>
            {[
              ['Faturamento',   fmtR(data.faturamento.total),   C.accent,   ''],
              ['Recebimentos',  fmtR(data.recebimentos.total),  '#16a34a',  ''],
              ['Volume PIs',    fmtR(data.pis.volume),          '#1565c0',  ''],
              ['Novos Clientes',data.novos_clientes.qtd||0,     '#7c3aed',  ''],
            ].map(function(item,i){
              return (
                <div key={i} style={{...s.kpi,borderLeft:'4px solid '+item[2]}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                    <div>
                      <div style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>{item[0]}</div>
                      <div style={{fontSize:item[3]?18:24,fontWeight:800,color:item[2]}}>{item[1]}</div>
                    </div>
                    <div style={{fontSize:24,opacity:0.25}}>{item[3]}</div>
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{display:'flex',gap:8,marginBottom:16}}>
            {['resumo','propostas','clientes','midias'].map(function(aba){
              return <button key={aba} onClick={function(){ setAbaAtiva(aba); }}
                style={{...s.btn(abaAtiva===aba?'primary':'ghost'),fontSize:12,textTransform:'capitalize'}}>{aba}</button>;
            })}
          </div>

          {abaAtiva === 'resumo' && (
            <div style={s.grid2}>
              <div style={s.card}>
                <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:14}}>Funil de Propostas</div>
                {[
                  ['Enviadas',  data.propostas.enviadas||0,  '#6366f1'],
                  ['Aprovadas', data.propostas.aprovadas||0, '#16a34a'],
                  ['Reprovadas',data.propostas.reprovadas||0,'#dc2626'],
                ].map(function(item,i){
                  const total = (data.propostas.enviadas||0) + 1;
                  const pct = Math.round((item[1]/total)*100);
                  return (
                    <div key={i} style={{marginBottom:14}}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                        <span style={{fontSize:12,color:C.muted}}>{item[0]}</span>
                        <span style={{fontSize:12,fontWeight:700,color:item[2]}}>{item[1]}</span>
                      </div>
                      <div style={{height:8,background:C.border,borderRadius:4}}>
                        <div style={{height:'100%',width:pct+'%',background:item[2],borderRadius:4}}/>
                      </div>
                    </div>
                  );
                })}
                <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid '+C.border,display:'flex',justifyContent:'space-between'}}>
                  <span style={{fontSize:12,color:C.muted}}>Taxa de conversao</span>
                  <span style={{fontSize:14,fontWeight:800,color:'#16a34a'}}>
                    {data.propostas.enviadas > 0 ? Math.round((data.propostas.aprovadas/data.propostas.enviadas)*100) : 0}%
                  </span>
                </div>
              </div>
              <div style={s.card}>
                <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:14}}>Evolucao de Recebimentos</div>
                {(data.evolucao_mensal||[]).map(function(ev,i){
                  const maxVal = Math.max(...(data.evolucao_mensal||[]).map(function(e){ return parseFloat(e.total||0); }), 1);
                  const pct = Math.round((parseFloat(ev.total||0)/maxVal)*100);
                  return (
                    <div key={i} style={{marginBottom:10}}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                        <span style={{fontSize:11,color:C.muted}}>{MESES[parseInt(ev.mes)-1]} {ev.ano}</span>
                        <span style={{fontSize:11,fontWeight:700,color:C.accent}}>{fmtR(ev.total)}</span>
                      </div>
                      <div style={{height:6,background:C.border,borderRadius:3}}>
                        <div style={{height:'100%',width:pct+'%',background:C.accent,borderRadius:3}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {abaAtiva === 'propostas' && (
            <div style={s.card}>
              <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:16}}>Analise de Propostas - {MESES[mes-1]} {ano}</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16,marginBottom:20}}>
                {[
                  ['Enviadas',  data.propostas.enviadas||0,  '#6366f1'],
                  ['Aprovadas', data.propostas.aprovadas||0, '#16a34a'],
                  ['Reprovadas',data.propostas.reprovadas||0,'#dc2626'],
                  ['Valor Aprovado', fmtR(data.propostas.valor_aprovado), C.accent],
                ].map(function(item,i){
                  return (
                    <div key={i} style={{background:'#f8fafc',borderRadius:10,padding:14,borderLeft:'3px solid '+item[2],textAlign:'center'}}>
                      <div style={{fontSize:10,color:C.muted,marginBottom:6,fontWeight:700,textTransform:'uppercase'}}>{item[0]}</div>
                      <div style={{fontSize:20,fontWeight:800,color:item[2]}}>{item[1]}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {abaAtiva === 'clientes' && (
            <div style={s.card}>
              <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:14}}>Top 5 Clientes - {MESES[mes-1]} {ano}</div>
              <table style={s.table}>
                <thead><tr>{['#','Cliente','Pagamentos','Total Pago'].map(function(h){ return <th key={h} style={s.th}>{h}</th>; })}</tr></thead>
                <tbody>
                  {(data.top_clientes||[]).map(function(c,i){
                    return (
                      <tr key={i}>
                        <td style={{...s.td,fontWeight:800,color:C.accent}}>{i+1}</td>
                        <td style={{...s.td,fontWeight:600}}>{c.empresa}</td>
                        <td style={s.td}>{c.qtd_pagamentos}</td>
                        <td style={{...s.td,fontWeight:700,color:'#16a34a'}}>{fmtR(c.total_pago)}</td>
                      </tr>
                    );
                  })}
                  {(!data.top_clientes||data.top_clientes.length===0) && (
                    <tr><td colSpan={4} style={{...s.td,textAlign:'center',color:C.muted,padding:24}}>Sem dados para este periodo.</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          )}

          {abaAtiva === 'midias' && (
            <div style={s.card}>
              <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:14}}>Midias Mais Vendidas - {MESES[mes-1]} {ano}</div>
              <table style={s.table}>
                <thead><tr>{['Midia','Qtd Vendas','Receita'].map(function(h){ return <th key={h} style={s.th}>{h}</th>; })}</tr></thead>
                <tbody>
                  {(data.top_midias||[]).map(function(m,i){
                    return (
                      <tr key={i}>
                        <td style={{...s.td,fontWeight:600}}>{m.nome}</td>
                        <td style={s.td}>{m.qtd}</td>
                        <td style={{...s.td,fontWeight:700,color:C.accent}}>{fmtR(m.receita)}</td>
                      </tr>
                    );
                  })}
                  {(!data.top_midias||data.top_midias.length===0) && (
                    <tr><td colSpan={3} style={{...s.td,textAlign:'center',color:C.muted,padding:24}}>Sem dados para este periodo.</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── LOG DE ACOES ──────────────────────────────────────────────
function LogAcoes() {
  const api = useApi();
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [busca, setBusca] = useState('');

  const ACOES_LABEL = {
    criar_cliente: { icon:'', label:'Novo cliente', cor:'#16a34a' },
    criar_proposta:{ icon:'', label:'Nova proposta', cor:'#1565c0' },
    login:         { icon:'', label:'Login',         cor:'#6366f1' },
  };

  const load = async () => {
    setLoading(true);
    try {
      const data = await api.get('/relatorios/logs?limit=100');
      if (Array.isArray(data)) setLogs(data);
    } catch(e) {}
    setLoading(false);
  };
  useEffect(function(){ load(); }, []);

  const filtrados = logs.filter(function(l){
    if (!busca) return true;
    return (l.usuario_nome||'').toLowerCase().includes(busca.toLowerCase()) ||
           (l.acao||'').toLowerCase().includes(busca.toLowerCase()) ||
           (l.tabela||'').toLowerCase().includes(busca.toLowerCase());
  });

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div>
          <h2 style={{fontSize:20,fontWeight:700,color:C.text}}>Log de Acoes</h2>
          <p style={{fontSize:13,color:C.muted,marginTop:2}}>Historico completo de atividades do sistema</p>
        </div>
        <Btn onClick={load} variant="ghost" style={{fontSize:12}}>Atualizar</Btn>
      </div>

      <div style={{marginBottom:16}}>
        <input style={s.input} placeholder="Buscar por usuario, acao ou tabela..." value={busca} onChange={function(e){ setBusca(e.target.value); }}/>
      </div>

      {loading && <div style={{textAlign:'center',padding:40,color:C.muted}}>Carregando logs...</div>}

      <div style={s.card}>
        <table style={s.table}>
          <thead>
            <tr>{['Data/Hora','Usuario','Perfil','Acao','Tabela','Registro'].map(function(h){ return <th key={h} style={s.th}>{h}</th>; })}</tr>
          </thead>
          <tbody>
            {filtrados.map(function(log, i) {
              const info = ACOES_LABEL[log.acao] || { icon:'•', label:log.acao, cor:C.muted };
              return (
                <tr key={i} style={{background:i%2===0?'transparent':'#f8fafc'}}>
                  <td style={{...s.td,fontSize:11,color:C.muted,whiteSpace:'nowrap'}}>
                    {log.criado_em ? new Date(log.criado_em).toLocaleString('pt-BR') : '-'}
                  </td>
                  <td style={{...s.td,fontWeight:600}}>{log.usuario_nome||'Sistema'}</td>
                  <td style={s.td}><span style={{...s.badge(C.accent),fontSize:10}}>{log.perfil||'-'}</span></td>
                  <td style={s.td}>
                    <span style={{fontSize:12}}>{info.icon} </span>
                    <span style={{fontSize:12,color:info.cor,fontWeight:600}}>{log.acao}</span>
                  </td>
                  <td style={{...s.td,fontFamily:'monospace',fontSize:11,color:C.muted}}>{log.tabela||'-'}</td>
                  <td style={{...s.td,fontFamily:'monospace',fontSize:10,color:C.muted}}>{log.registro_id ? log.registro_id.substring(0,8)+'...' : '-'}</td>
                </tr>
              );
            })}
            {!loading && filtrados.length === 0 && (
              <tr><td colSpan={6} style={{...s.td,textAlign:'center',color:C.muted,padding:32}}>Nenhum log encontrado.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}


const MODULES = { dashboard:Dashboard, crm:CRM, propostas:Propostas, pi:PI, producao:Producao, financeiro:Financeiro, faturamento:Faturamento, notas:NotasFiscais, checking:Checking, alertas:Alertas, relatorio:RelatorioMensal, logs:LogAcoes };
const NAV = [
  {id:'dashboard',icon:'⬡',label:'Dashboard'},
  {id:'crm',icon:'O',label:'CRM / Clientes'},
  {id:'propostas',icon:'◈',label:'Propostas'},
  {id:'pi',icon:'◆',label:'Pedidos de Insercao'},
  {id:'producao',icon:'O',label:'Producao'},
  {id:'financeiro',icon:'◐',label:'Financeiro'},
  {id:'faturamento',icon:'◑',label:'Faturamento'},
  {id:'notas',icon:'◒',label:'Notas Fiscais'},
  {id:'checking',icon:'◓',label:'Checking Fotografico'},
  {id:'alertas',  icon:'',label:'Alertas'},
  {id:'relatorio',icon:'',label:'Relatorio Mensal'},
  {id:'logs',     icon:'',label:'Log de Acoes'},
];

function AlertaBadge() {
  const api = useApi();
  const [count, setCount] = useState(0);
  useEffect(function(){
    api.get('/alertas').then(function(data){
      if (Array.isArray(data)) {
        setCount(data.filter(function(a){ return a.nivel === 'critico' || a.nivel === 'aviso'; }).length);
      }
    }).catch(function(){});
  }, []);
  if (count === 0) return null;
  return (
    <div style={{position:'relative',cursor:'pointer'}} onClick={function(){ window.location.hash = 'alertas'; }}>
      <div style={{background:'#dc2626',color:'white',borderRadius:20,padding:'4px 10px',fontSize:11,fontWeight:700,display:'flex',alignItems:'center',gap:4}}>
         {count} alerta{count > 1 ? 's' : ''}
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(null);
  const [mod, setMod] = useState('dashboard');
  const [mini, setMini] = useState(false);

  useEffect(()=>{
    const token = localStorage.getItem('ooh_token');
    if (token) {
      fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+token}})
        .then(r=>r.json()).then(u=>{ if(u.id) setUser(u); else localStorage.removeItem('ooh_token'); })
        .catch(()=>null);
    }
  },[]);

  if (!user) return <Login onLogin={setUser}/>;

  const Mod = MODULES[mod]||Dashboard;

  return (
    <div style={s.app}>
      <div style={{...s.sidebar,width:mini?64:220,transition:'width 0.2s',overflow:'hidden'}}>
        <div style={s.logo}>
          {!mini
            ? <img src={window.EXFERA_LOGO} style={{height:36,objectFit:'contain',maxWidth:190,mixBlendMode:'screen'}} alt="Exfera"/>
            : <div style={{width:36,height:36,background:'rgba(255,255,255,0.2)',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,fontWeight:900,color:'white',flexShrink:0}}>E</div>
          }
        </div>
        <nav style={{flex:1,padding:'10px 0',overflow:'auto'}}>
          {NAV.map(item=>{
            const isActive = mod===item.id;
            return (
            <div key={item.id} onClick={()=>setMod(item.id)} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',cursor:'pointer',borderRadius:10,margin:'2px 8px',background:isActive?C.sidebarActive:'transparent',color:isActive?C.sidebarText:C.sidebarMuted,fontSize:13,fontWeight:isActive?600:400,transition:'all 0.15s',whiteSpace:'nowrap',overflow:'hidden',borderLeft:isActive?'3px solid rgba(255,255,255,0.85)':'3px solid transparent'}}>
              <span style={{fontSize:16,flexShrink:0,width:20,textAlign:'center'}}>{item.icon}</span>
              {!mini&&<span>{item.label}</span>}
            </div>
          );
          })}
        </nav>
        <div style={{padding:'12px 8px',borderTop:'1px solid rgba(255,255,255,0.1)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px',cursor:'pointer'}} onClick={()=>{ localStorage.removeItem('ooh_token'); setUser(null); }}>
            <div style={{width:28,height:28,borderRadius:'50%',background:'rgba(255,255,255,0.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'white',flexShrink:0}}>{(user.nome||'A')[0]}</div>
            {!mini&&<div><div style={{fontSize:12,fontWeight:600,color:'white'}}>{user.nome}</div><div style={{fontSize:10,color:'rgba(255,255,255,0.55)'}}>Sair</div></div>}
          </div>
        </div>
      </div>
      <div style={s.main}>
        <div style={s.topbar}>
          <button style={{...s.btn('ghost'),fontSize:18,padding:'4px 8px'}} onClick={()=>setMini(p=>!p)}></button>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:12,color:C.muted,background:C.card,padding:'4px 12px',borderRadius:20,border:'1px solid '+C.border}}>{user.perfil}</span>
          </div>
        </div>
        <div style={s.content}><Mod/></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
