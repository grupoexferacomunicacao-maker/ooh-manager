version: "3.9"

services:

  # ── Banco de dados PostgreSQL ──────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ooh_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ooh_manager
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ooh_senha_local
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend Node.js ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ooh_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT:          3001
      NODE_ENV:      development
      DB_HOST:       db
      DB_PORT:       5432
      DB_NAME:       ooh_manager
      DB_USER:       postgres
      DB_PASSWORD:   ooh_senha_local
      JWT_SECRET:    dev_jwt_secret_troque_em_producao
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL:  http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    ports:
      - "3001:3001"

  # ── Frontend React (Vite) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ooh_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"

volumes:
  pg_data:
  uploads_data:
